# Conda environment for the PINK/CGCNN reproduction.
#
#   conda env create -f environment.yml
#   conda activate pink-cgcnn
#
# Python is pinned to 3.11: pymatgen and matminer do not yet install cleanly on
# 3.14, and torch wheels lag new Python releases by several months.
name: pink-cgcnn
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
